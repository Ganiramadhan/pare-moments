apiVersion: v1
kind: Namespace
metadata:
  name: pare-moments
  labels:
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pare-moments-quota
  namespace: pare-moments
spec:
  hard:
    requests.cpu: "300m"
    requests.memory: "256Mi"
    limits.cpu: "800m"
    limits.memory: "512Mi"
    pods: "6"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: pare-moments-limitrange
  namespace: pare-moments
spec:
  limits:
  - type: Container
    default:
      cpu: "100m"
      memory: "64Mi"
    defaultRequest:
      cpu: "50m"
      memory: "32Mi"
    max:
      cpu: "300m"
      memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pare-moments
  namespace: pare-moments
  labels:
    app: pare-moments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pare-moments
  template:
    metadata:
      labels:
        app: pare-moments
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101    # nginx user di image alpine
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pare-moments
        image: docker.io/library/pare-moments:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3305
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-cache-nginx
          mountPath: /var/cache/nginx
        - name: var-run
          mountPath: /var/run
        readinessProbe:
          httpGet:
            path: /
            port: 3305
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3305
          initialDelaySeconds: 10
          periodSeconds: 15
      volumes:
      - name: tmp
        emptyDir: {}
      - name: var-cache-nginx
        emptyDir: {}
      - name: var-run
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pare-moments
  namespace: pare-moments
spec:
  selector:
    app: pare-moments
  ports:
  - port: 80
    targetPort: 3305
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pare-moments
  namespace: pare-moments
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
  - host: moments.ganipedia.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pare-moments
            port:
              number: 80
  tls:
  - hosts: ["moments.ganipedia.com"]
    secretName: pare-moments-tls
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pare-moments
  namespace: pare-moments
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pare-moments
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pare-moments-pdb
  namespace: pare-moments
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pare-moments
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: pare-moments
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-traefik
  namespace: pare-moments
spec:
  podSelector:
    matchLabels:
      app: pare-moments
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 3305
