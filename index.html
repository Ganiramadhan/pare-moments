<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script src="/boot.js"></script>

    <!-- Keep the title, description and share texts equal to src/shared/config/site.ts. -->
    <title>Pare Moments · My English journey in Kampung Inggris</title>
    <meta
      name="description"
      content="Photos, videos and little stories from my English learning journey in Kampung Inggris, Pare (Kediri, East Java). Follow the day-by-day timeline, browse the gallery, play the slideshow and share your own moments."
    />
    <meta name="author" content="Pare Moments" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0d9488" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1120" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- How the link looks when it is shared (WhatsApp, Telegram, Twitter, Facebook...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pare Moments" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Pare Moments · My English journey in Kampung Inggris" />
    <meta
      property="og:description"
      content="Photos, videos and little stories from my English learning journey in Kampung Inggris, Pare."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Pare Moments: a fan of photos from the English journey"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pare Moments · My English journey in Kampung Inggris" />
    <meta
      name="twitter:description"
      content="Photos, videos and little stories from my English learning journey in Kampung Inggris, Pare."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data, so search engines understand what this website is. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Pare Moments",
        "url": "%VITE_SITE_URL%/",
        "description": "Photos, videos and little stories from an English learning journey in Kampung Inggris, Pare (Kediri, East Java).",
        "inLanguage": "en"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main
        style="
          font-family: system-ui, sans-serif;
          max-width: 40rem;
          margin: 3rem auto;
          padding: 0 1rem;
        "
      >
        <h1>Pare Moments</h1>
        <p>
          Photos, videos and little stories from my English learning journey in Kampung Inggris,
          Pare (Kediri, East Java).
        </p>
        <p>This website needs JavaScript to show the photos. Please turn it on and reload.</p>
      </main>
    </noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
