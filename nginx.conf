server {
  listen 3305;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/manifest+json application/xml image/svg+xml text/plain text/xml;

  # Security headers. They apply everywhere (a location that sets its own add_header would
  # replace them, so locations below only use `expires`).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  # Only what the website really uses: its own files, Google Fonts, and photos from the device
  # (data: and blob: are for the photos friends add). No inline scripts are allowed.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Built files have a hash in their name, so they can be cached for a long time.
  location ^~ /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Photos and videos. Video files are served in ranges, so seeking works.
  location ^~ /images/ {
    expires 30d;
    try_files $uri =404;
  }

  # Icons and the share picture rarely change.
  location ~* ^/[^/]+\.(png|ico|svg)$ {
    expires 7d;
    try_files $uri =404;
  }

  # The service worker and the files that describe the website must always be re-checked,
  # otherwise visitors can get stuck on an old version.
  location ~ ^/(sw\.js|registerSW\.js|boot\.js|manifest\.webmanifest|workbox-.*\.js|sitemap\.xml|robots\.txt)$ {
    expires -1;
    try_files $uri =404;
  }

  # Everything else is a page of the single-page app, so unknown paths load index.html.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
